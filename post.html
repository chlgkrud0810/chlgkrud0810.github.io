         // 1520x830 크기의 새 창을 열고 그 창으로 폼을 제출
         function openPopupAndSubmit() {
         const w = 1520, h = 830;
         const left = (window.screen.width - w) / 2;
         const top = (window.screen.height - h) / 2;
         window.open(
            "",
            "popupWin",
            `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`
         );
         return true; // 폼 기본 제출 진행 (target="popupWin" 창으로 전송됨)
         }
            
         // User-Agent 기준 모바일 여부 판단 후 action 도메인 전환
         (function setActionByDevice() {
         const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
         const form = document.getElementById("bookingForm");
         form.action = isMobile
            ? "https://mfilmonestop.maketicket.co.kr/booking"
            : "https://filmonestop.maketicket.co.kr/booking";
         })();

               
         // sdCode 입력값으로 sessionDataList에서 찾아 폼에 반영 (HTTP 요청 없음)
         function lookupSdCode(sdCode) {
            // const sdCode = document.getElementById("sdCodeLookup").value.trim();
            sdCode = sdCode || document.getElementById("sdCodeLookup").value.trim();
            const infoEl = document.getElementById("lookupInfo");
            document.getElementById("sdCodeLookup").value = sdCode;
            if (!sdCode) {
               infoEl.textContent = "sdCode를 입력해주세요.";
               return;
            }
            
            const item = sessionDataList.find(d => d.sdCode === sdCode);
            
            if (!item) {
               infoEl.textContent = `sdCode "${sdCode}"에 해당하는 데이터를 찾을 수 없습니다.`;
               return;
            }
            
            applyDataToForm(item);
         }
               
         // 조회/프리셋 공통: 데이터 객체를 폼 인풋에 반영
         function applyDataToForm(item) {
            const form = document.getElementById("bookingForm");
            const infoEl = document.getElementById("lookupInfo");
            
            if (item.prodSeq != null) form.prodSeq.value = item.prodSeq;
            if (item.prodTycd != null) form.prodTyCd.value = item.prodTycd;
            else if (item.prodTyCd != null) form.prodTyCd.value = item.prodTyCd;
            if (item.sdSeq != null) form.sdSeq.value = item.sdSeq;
            
            if (item.sdCode != null) {
               const url = new URL(form.rtnUrl.value);
               url.searchParams.set("sdCode", item.sdCode);
               form.rtnUrl.value = url.toString();
            }
            
            infoEl.textContent =
               `조회됨: ${item.sdCode ?? ""} | ${item.perfMainNm ?? ""} | ${item.sdDate ?? ""} ${item.sdTime ?? ""} | ${item.venueNm ?? ""} ${item.hallNm ?? ""}`;
         }
            
         lookupSdCode('001');
         
      </script>
